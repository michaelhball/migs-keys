[project]
name = "migs-keys-tools"
version = "0.1.0"
description = "Local score, video, audio and flashcard tools for Migs Keys"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy>=2.2,<3", "Pillow==13.0.0"]

[dependency-groups]
flashcards = ["genanki==0.13.1", "anki==25.9.2"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
